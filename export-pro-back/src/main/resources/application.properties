spring.application.name=export-pro-back
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/export_pro
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=export-pro-super-secret-jwt-key-minimum-256-bits-long-for-hs256
app.jwt.expiration-ms=86400000

# AI Service
app.ai.base-url=http://localhost:8000

# File Storage
app.storage.type=local
app.storage.local.path=./uploads

# CORS
app.cors.allowed-origins=http://localhost:3000

# Logging
logging.level.org.example.exportproback=DEBUG
